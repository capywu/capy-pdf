# Capy PDF：在 GitHub 上自動打包 Mac 版（.dmg）與 Windows 版（.exe）
# 使用方式：到 GitHub 專案的「Actions」→「打包 Capy PDF」→「Run workflow」
name: 打包 Capy PDF

on:
  workflow_dispatch:
    inputs:
      target:
        description: '要打包哪個版本'
        required: true
        default: 'mac'
        type: choice
        options: [mac, both, windows]
      mac_runner:
        description: 'Mac 打包主機（Apple 晶片主機常排隊時請選 intel）'
        required: true
        default: 'intel'
        type: choice
        options: [intel, arm]
  push:
    tags: ['v*']

defaults:
  run:
    shell: bash

jobs:
  mac:
    if: github.event_name == 'push' || inputs.target != 'windows'
    # 打包出來的 App 都是 Intel＋Apple 晶片通用版，與用哪種主機打包無關
    runs-on: ${{ inputs.mac_runner == 'arm' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 尋找程式資料夾
        run: |
          PJ=$(find . -maxdepth 4 -name package.json -not -path '*/node_modules/*' -exec grep -l '"capy-pdf"' {} + | head -1)
          if [ -z "$PJ" ]; then
            echo "::error::找不到 Capy PDF 的程式資料夾（desktop/package.json）。請確認有上傳 desktop 資料夾。目前專案內容如下："
            find . -maxdepth 3 -not -path './.git*' | sort
            exit 1
          fi
          echo "APPDIR=$(dirname "$PJ")" >> "$GITHUB_ENV"
          echo "程式資料夾：$(dirname "$PJ")"
      - name: 安裝打包工具
        run: cd "$APPDIR" && npm install --no-audit --no-fund
      - name: 打包 Mac App（Intel＋Apple 晶片通用）
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: cd "$APPDIR" && npx electron-builder --mac dir --universal --publish never
      - name: 簽署（自用簽章）並製作 DMG
        run: |
          cd "$APPDIR"
          APP="$(ls -d dist/mac*/*.app | head -1)"
          echo "App: $APP"
          xattr -cr "$APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --verbose=1 "$APP"
          VER=$(node -p "require('./package.json').version")
          rm -rf dmgroot && mkdir dmgroot
          cp -R "$APP" dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Capy PDF" -srcfolder dmgroot -ov -format UDZO "dist/Capy-PDF-Mac-$VER.dmg"
      - uses: actions/upload-artifact@v6
        with:
          name: Capy-PDF-Mac
          path: ${{ env.APPDIR }}/dist/*.dmg
          retention-days: 30

  windows:
    if: github.event_name == 'push' || inputs.target != 'mac'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 尋找程式資料夾
        run: |
          PJ=$(find . -maxdepth 4 -name package.json -not -path '*/node_modules/*' -exec grep -l '"capy-pdf"' {} + | head -1)
          if [ -z "$PJ" ]; then
            echo "::error::找不到 Capy PDF 的程式資料夾（desktop/package.json）。請確認有上傳 desktop 資料夾。目前專案內容如下："
            find . -maxdepth 3 -not -path './.git*' | sort
            exit 1
          fi
          echo "APPDIR=$(dirname "$PJ")" >> "$GITHUB_ENV"
          echo "程式資料夾：$(dirname "$PJ")"
      - name: 安裝打包工具
        run: cd "$APPDIR" && npm install --no-audit --no-fund
      - name: 打包 Windows 安裝檔＋攜帶版
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: cd "$APPDIR" && npx electron-builder --win nsis portable --x64 --publish never
      - uses: actions/upload-artifact@v6
        with:
          name: Capy-PDF-Windows
          path: ${{ env.APPDIR }}/dist/*.exe
          retention-days: 30
