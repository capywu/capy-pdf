# Capy PDF：在 GitHub 上自動打包 Mac 版（.dmg）與 Windows 版（.exe）
# 使用方式：到 GitHub 專案的「Actions」→「打包 Capy PDF」→「Run workflow」
name: 打包 Capy PDF
 
on:
  workflow_dispatch:
    inputs:
      target:
        description: '要打包哪個版本'
        required: true
        default: 'both'
        type: choice
        options: [both, mac, windows]
  push:
    tags: ['v*']
 
jobs:
  mac:
    if: github.event_name == 'push' || inputs.target != 'windows'
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安裝打包工具
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: 打包 Mac App（Intel＋Apple 晶片通用）
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dir --universal --publish never
      - name: 簽署（自用簽章）並製作 DMG
        working-directory: desktop
        run: |
          APP="$(ls -d dist/mac*/*.app | head -1)"
          echo "App: $APP"
          xattr -cr "$APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --verbose=1 "$APP"
          VER=$(node -p "require('./package.json').version")
          rm -rf dmgroot && mkdir dmgroot
          cp -R "$APP" dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Capy PDF" -srcfolder dmgroot -ov -format UDZO "dist/Capy-PDF-Mac-$VER.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: Capy-PDF-Mac
          path: desktop/dist/*.dmg
          retention-days: 30
 
  windows:
    if: github.event_name == 'push' || inputs.target != 'mac'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安裝打包工具
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: 打包 Windows 安裝檔
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Capy-PDF-Windows
          path: desktop/dist/*.exe
          retention-days: 30
 
